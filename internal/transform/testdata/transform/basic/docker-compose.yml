services:
  web:
    image: node:22-alpine
    command: ["npm", "run", "dev"]
    ports: ["5173:5173"]
    restart: always
    environment:
      EXISTING: keep-me
    depends_on: [api]
  api:
    build:
      context: ./api
    ports: ["8080:8080", "9229:9229"]
    volumes:
      - ./api:/src
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 2s
volumes:
  pgdata:
